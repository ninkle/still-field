<!doctype html>
<html lang="en" data-installation="true">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Still Field · living texture</title>
<style>
  :root { color-scheme:dark; --foreground:#d7d9ce; --muted-foreground:#a5aa9b; --background:#20231f; }
  * {box-sizing:border-box;}
  body {margin:0; background:var(--background); color:var(--foreground); font:14px/1.5 system-ui,sans-serif;}
  main {max-width:1560px;margin:auto;padding:24px;}
  header {display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px;}
  h1 {font:500 15px/1.4 system-ui,sans-serif;letter-spacing:.16em;margin:0;}
  header span {font-size:12px;color:var(--muted-foreground);}
  button,select,input {font:inherit;accent-color:#aebaa0;}
  button,select {color:inherit;background:#30362e;border:1px solid #4a5244;border-radius:6px;padding:8px 12px;}
  button {cursor:pointer;}
  button:hover {background:#3d4638;}
  button:disabled {opacity:.5;cursor:wait;}
  input[type=range] {display:block;width:100%;margin:8px 0 0;}
  .form-label {font-size:12px;}
  .text-small {font-size:12px;}
  .text-muted {color:var(--muted-foreground);}
  #still-field-art:fullscreen {width:100vw;height:100vh;background:#20231f;}
  #still-field-art:fullscreen .sf-stage {width:100%;height:100%;aspect-ratio:auto;}
  #still-field-art:fullscreen .sf-controls, #still-field-art:fullscreen .sf-note {display:none;}
  #still-field-art:fullscreen.sf-idle {cursor:none;}
  #sf-camera-panel {margin-top:24px;padding-top:18px;border-top:1px solid #4a5244;}
  #sf-camera-panel[hidden] {display:none;}
  .sf-camera-top,.sf-camera-options {display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px;}
  .sf-camera-top strong {font-weight:500;}
  .sf-camera-top span,.sf-camera-help,.sf-camera-options {font-size:12px;}
  .sf-camera-options label {display:flex;align-items:center;gap:6px;}
  .sf-camera-view {max-width:640px;}
  .sf-camera-view canvas {display:block;width:100%;height:auto;}
  .sf-camera-view [hidden] {display:none;}
  .sf-camera-help {color:var(--muted-foreground);max-width:640px;}
  #sf-installation-settings {margin-top:24px;border-top:1px solid #4a5244;padding-top:16px;}
  #sf-installation-settings summary {cursor:pointer;margin-bottom:14px;}
  .sf-settings-grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:16px;}
  .sf-settings-grid label {display:flex;flex-direction:column;gap:5px;min-width:0;}
  .sf-settings-grid select {max-width:100%;}
  body.sf-display {overflow:hidden;}
  body.sf-display main {padding:0;max-width:none;}
  body.sf-display header,body.sf-display #still-field-art .sf-controls,body.sf-display #still-field-art .sf-note,body.sf-display #sf-installation-settings,body.sf-display #sf-camera-panel {display:none;}
  body.sf-display #still-field-art .sf-stage {width:100vw;height:100vh;aspect-ratio:auto;}
  body.sf-display #still-field-art.sf-idle {cursor:none;}
  @media(max-width:600px){main{padding:16px;}header{flex-direction:column;gap:4px;}}
</style>
</head>
<body>
<main>
<header><h1>STILL FIELD</h1><span>A living study from Frame 333 · F for full screen · Space to pause</span></header>
{{ARTWORK}}
{{SETTINGS_PANEL}}
{{CAMERA_PANEL}}
</main>
<script type="application/json" id="sf-camera-assets">{{CAMERA_ASSETS}}</script>
<script>
{{SETTINGS_SCRIPT}}
</script>
<script>
{{INSTALLATION_SCRIPT}}
</script>
<script>
{{CAMERA_SCRIPT}}
</script>
</body>
</html>
